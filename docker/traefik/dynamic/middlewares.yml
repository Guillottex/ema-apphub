# Configuración dinámica de Traefik (se recarga automáticamente)
http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

tls:
  options:
    default:
      minVersion: VersionTLS12
